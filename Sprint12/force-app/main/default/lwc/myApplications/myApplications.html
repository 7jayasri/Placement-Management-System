<template>

    <lightning-card
        title="My Applications"
        icon-name="standard:product">

        <div class="slds-p-around_medium">

            <template if:true={error}>

                <div class="slds-text-color_error slds-p-around_medium">
                    Unable to load your applications.
                </div>

            </template>

            <template if:false={error}>

                <template if:true={applications.length}>

                    <template
                        for:each={applications}
                        for:item="application">

                        <div
                            key={application.Id}
                            class="slds-box slds-m-bottom_medium">

                            <h2 class="slds-text-heading_medium">
                                {application.Job__r.Name}
                            </h2>

                            <p>
                                <strong>Company:</strong>
                                {application.Job__r.Company__c}
                            </p>

                            <p>
                                <strong>Package:</strong>
                                {application.Job__r.Package__c} LPA
                            </p>

                            <p>
                                <strong>Location:</strong>
                                {application.Job__r.Location__c}
                            </p>

                            <p>
                                <strong>Application Date:</strong>
                                {application.Application_Date__c}
                            </p>

                            <p>
                                <strong>Status:</strong>
                                {application.Status__c}
                            </p>

                        </div>

                    </template>

                </template>

                <template if:false={applications.length}>

                    <div class="slds-align_absolute-center slds-p-around_large">
                        You have not applied for any jobs yet.
                    </div>

                </template>

            </template>

        </div>

    </lightning-card>

</template>
